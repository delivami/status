# Change these first
owner: delivami
repo: status

sites:
  - name: Marketing Site
    url: https://delivami.com
  - name: Web App
    url: https://app.delivami.com
  - name: Documentation
    url: https://docs.delivami.com
  - name: Changelog
    url: https://changelog.delivami.com
  - name: Admin Dashboard
    url: https://admin.delivami.com
    
  # --- API & Workers (We expect these to return auth/path errors if pinged directly) ---
  - name: Assets CDN
    url: https://assets.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]
  - name: Image Proxy
    url: https://images.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]
  - name: Realtime Server
    url: https://realtime.delivami.com
    expectedStatusCodes: [200, 401, 403, 404, 426]
  - name: AI Service
    url: https://ai.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]

status-website:
  # General Settings
  cname: status.delivami.com
  name: Delivami
  theme: dark
  logoUrl: https://delivami.com/delivami.png
  favicon: https://delivami.com/favicon.png
  
  # Text
  introTitle: "**Delivami Systems Status**"
  introMessage: "Real-time uptime monitoring for all Delivami services."
  
  # Navigation
  navbar:
    - title: Status
      href: /
    - title: Delivami.com
      href: https://delivami.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  # Custom Design
  customCss: |
    /* Change the main font */
    body {
      font-family: 'Inter', sans-serif !important;
      background-color: #f8fafc;
    }
    
    /* Change the color of the "Up" green badges to a specific brand green */
    .badge.success {
      background-color: #10b981 !important;
    }
    
    /* Hide the footer if you don't want the "Powered by Upptime" text */
    footer {
      display: none !important;
    }
    
    /* Make the top navigation bar black */
    nav {
      background-color: #0f172a !important;
    }
    nav a {
      color: white !important;
    }
