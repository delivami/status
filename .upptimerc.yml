# Change these first
owner: delivami
repo: status

sites:
  - name: Marketing Site
    url: https://delivami.com
  - name: Web App
    url: https://app.delivami.com
  - name: Documentation
    url: https://docs.delivami.com
  - name: Changelog
    url: https://changelog.delivami.com
  - name: Admin Dashboard
    url: https://admin.delivami.com
    
  # --- API & Workers (We expect these to return auth/path errors if pinged directly) ---
  - name: Assets CDN
    url: https://assets.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]
  - name: Image Proxy
    url: https://images.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]
  - name: Realtime Server
    url: https://realtime.delivami.com
    expectedStatusCodes: [200, 401, 403, 404, 426] # 426 is Upgrade Required (for websockets)
  - name: AI Service
    url: https://ai.delivami.com
    expectedStatusCodes: [200, 401, 403, 404]


status-website:
  # This is where your status page will live once you configure DNS
  cname: status.delivami.com
  
  logoUrl: https://app.delivami.com/delivami.png
  name: Delivami Status
  introTitle: "**Delivami System Status**"
  introMessage: Welcome to the Delivami status page. Here you can find real-time information regarding the uptime of our core services, APIs, and web applications.
  
  navbar:
    - title: Status
      href: /
    - title: Delivami.com
      href: https://delivami.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration


status-website:
  cname: status.delivami.com
  theme: dark # Options are: light, dark, or auto (based on user's system)
  logoUrl: https://delivami.com/delivami.png
  favicon: https://delivami.com/favicon.png # Changes the browser tab icon
  name: Delivami
  introTitle: "Delivami Systems Status"
  introMessage: "Real-time uptime monitoring for all Delivami services."
  customCss: |
    /* Change the main font */
    body {
      font-family: 'Inter', sans-serif !important;
      background-color: #f8fafc;
    }
    
    /* Change the color of the "Up" green badges to a specific brand green */
    .badge.success {
      background-color: #10b981 !important;
    }
    
    /* Hide the footer if you don't want the "Powered by Upptime" text */
    footer {
      display: none !important;
    }
    
    /* Make the top navigation bar black */
    nav {
      background-color: #0f172a !important;
    }
    nav a {
      color: white !important;
    }

